<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Toast</title><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>

<div class="mp-stage col">
  <div class="mp-toast" role="status"><span class="ic success"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>Événement publié. Les ventes sont ouvertes.<button class="act">Voir</button></div>
  <div class="mp-toast" role="alert"><span class="ic danger"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></span>Paiement refusé par l'opérateur. Réessayez ou changez de moyen.</div>
  <div class="mp-toast" role="status"><span class="ic info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg></span>Lien du billet copié.<button class="act">Annuler</button></div>
</div>
</body>
</html>
