<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Button</title><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>

<div class="mp-stage col">
  <div class="mp-row">
    <button class="mp-btn brand l">Payer 25 000 FCFA <svg class="mp-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="mp-btn primary">Publier l'événement</button>
    <button class="mp-btn secondary">Aperçu</button>
    <button class="mp-btn tertiary">Annuler</button>
    <button class="mp-btn danger">Rembourser</button>
  </div>
  <div class="mp-row">
    <button class="mp-btn primary is-hover">Hover</button>
    <button class="mp-btn primary is-active">Actif</button>
    <button class="mp-btn primary is-focus">Focus clavier</button>
    <button class="mp-btn brand is-hover">CTA hover</button>
    <button class="mp-btn primary" disabled>Désactivé</button>
    <button class="mp-btn primary" aria-busy="true"><svg class="mp-spin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".25"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-dasharray="14 60"/></svg>Paiement…</button>
  </div>
  <div class="mp-row">
    <button class="mp-btn primary s"><svg class="mp-icon s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Petit · 32</button>
    <button class="mp-btn primary">Moyen · 44</button>
    <button class="mp-btn primary l">Large · 52</button>
    <button class="mp-btn secondary icon" aria-label="Partager"><svg class="mp-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg></button>
    <button class="mp-btn secondary icon s" aria-label="Plus d'options"><svg class="mp-icon s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  </div>
</div>
</body>
</html>
