<!-- @dsCard group="Retours" height=170 subtitle="Statut = icône + mot + couleur. Jamais la couleur seule." -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Badge</title><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>

<div class="mp-stage col">
  <div class="mp-row"><span class="mp-overline" style="width:80px">Billets</span>
    <span class="mp-badge success"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Valide</span>
    <span class="mp-badge neutral"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Utilisé</span>
    <span class="mp-badge warning"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Paiement en attente</span>
    <span class="mp-badge danger"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>Annulé</span>
    <span class="mp-badge info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>Remboursé</span></div>
  <div class="mp-row"><span class="mp-overline" style="width:80px">Événements</span>
    <span class="mp-badge info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>Brouillon</span>
    <span class="mp-badge brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>En vente</span>
    <span class="mp-badge warning"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4M12 17h.01"/></svg>Bientôt complet</span>
    <span class="mp-badge neutral"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>Complet</span>
    <span class="mp-badge neutral"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Terminé</span></div>
</div>
</body>
</html>
